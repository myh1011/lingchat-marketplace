name: Publish

on:
  push:
    branches: [main]
    paths: ['registry/**']
  # review.yml 合并 PR 后显式触发（GITHUB_TOKEN 的 push 不会触发新 workflow）
  repository_dispatch:
    types: [publish-packages]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. 变更包检测（优先用 review.yml dispatch 传来的包名；push 触发时用 git diff）──
      # git diff 分支排除 build.json（CI 自身产物）：它的提交不会再次触发打包
      - name: Detect changed packages
        id: changed
        run: |
          FROM_DISPATCH="${{ github.event.client_payload.pkgs }}"
          if [ -n "$FROM_DISPATCH" ]; then
            CHANGED=$(echo "$FROM_DISPATCH" | tr ' ' '\n' | grep -E '^[a-z0-9_-]+$' | sort -u | tr '\n' ' ' || true)
            echo "来源: repository_dispatch client_payload"
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^registry/' | grep -v '/build.json$' | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)
            echo "来源: git diff HEAD^ HEAD"
          fi
          echo "CHANGED=$CHANGED"
          echo "pkgs=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "registry 无变更，退出"
            exit 0
          fi

      # ── 2. 逐包打包 + 建 Release + 汇总元数据 ──
      - name: Build and release packages
        env:
          GH_TOKEN: ${{ github.token }}
          PKGS: ${{ steps.changed.outputs.pkgs }}
        run: |
          mkdir -p dist /tmp/meta
          for pkg in $PKGS; do
            VER=$(python3 -c "import tomllib; print(tomllib.load(open('registry/$pkg/manifest.toml','rb'))['version'])")
            TAG="$pkg-$VER"
            echo "=== 打包 $pkg -> $TAG ==="
            python3 scripts/build_package.py "registry/$pkg" --out dist --release-tag "$TAG" \
              --repo "${{ github.repository }}" > "/tmp/meta/$pkg.json"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "⚠️ Release $TAG 已存在（版本重复？），跳过创建"
            else
              gh release create "$TAG" "dist/$pkg-$VER.zip" --title "$TAG" --notes "由 AI 审核流水线自动发布"
            fi
          done

      # ── 3. 更新 plugins.json ──
      - name: Update registry
        env:
          PKGS: ${{ steps.changed.outputs.pkgs }}
        run: |
          for pkg in $PKGS; do
            python3 scripts/update_registry.py --meta "/tmp/meta/$pkg.json" \
              --review-report-url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          done

      # ── 3.5 生成每包 build.json（客户端动态索引用：sha256/size/下载地址/审核链接）──
      # 在打包之后生成，故 build.json 不会被打进 zip；[skip ci] 提交防止递归触发
      - name: Generate build.json
        env:
          PKGS: ${{ steps.changed.outputs.pkgs }}
        run: |
          for pkg in $PKGS; do
            PKG="$pkg" python3 - <<'PYEOF' || exit 1
          import json, os
          pkg = os.environ["PKG"]
          meta = json.load(open(f"/tmp/meta/{pkg}.json"))
          build = {
              "id": meta["id"],
              "version": meta["version"],
              "sha256": meta["sha256"],
              "size": meta["size"],
              "download_url": meta["download_url"],
              "review_report_url": f"https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
          }
          with open(f"registry/{pkg}/build.json", "w", encoding="utf-8") as f:
              json.dump(build, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"[build.json] {pkg}@{meta['version']} sha256={meta['sha256'][:12]}...")
          PYEOF
          done

      # ── 4. 提交 plugins.json + build.json（[skip ci] 防止递归触发）──
      - name: Commit registry
        env:
          PKGS: ${{ steps.changed.outputs.pkgs }}
        run: |
          git config user.name "market-bot[bot]"
          git config user.email "market-bot[bot]@users.noreply.github.com"
          git add plugins.json registry/*/build.json
          git commit -m "chore: update plugins.json + build.json [skip ci]" || echo "无变化"
          git push
