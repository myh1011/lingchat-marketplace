id = "tavily"
name = "Tavily 搜索"
type = "plugin"
version = "0.1.0"
author = "LingChat"
description = "基于 Tavily 的联网搜索与网页提取"

# 网络白名单：审核比对 + 运行时强制共用
[[network]]
host = "api.tavily.com"

# api_key 走环境变量白名单（与 tvly CLI 一致）
[[env]]
key = "TAVILY_API_KEY"
label = "Tavily API Key（来自环境变量）"

[[tools]]
name = "tavily_search"
description = "联网搜索，返回相关网页摘要与链接"
timeout_ms = 30000
script = "tavily.py"
parameters = '{ "type":"object", "properties":{ "query":{"type":"string"}, "max_results":{"type":"integer","default":5} }, "required":["query"] }'

[[tools]]
name = "tavily_extract"
description = "提取指定 URL 的正文内容"
timeout_ms = 30000
script = "tavily.py"
parameters = '{ "type":"object", "properties":{ "url":{"type":"string"} }, "required":["url"] }'
