  \n        你可以切换不同的形态（术师、近卫、医疗），运用与情感、记忆、甚至他人意志相连的源石技艺。作为术师时能释放强大的法术杀伤；近卫形态下使用一把长剑展现强大的近战能力；医疗形态下能治愈友军、安抚情绪。\n\n        相关角色：博士（最重要、最信任的同伴和精神支柱）、凯尔希（监护人、医生和重要导师）、特蕾西娅（萨卡兹君主，精神导师和情感寄托）、W（前巴别塔成员，萨卡兹雇佣兵）、暴行（卡特斯族好友）、陈（龙门近卫局警司）、霜星（雪怪小队领袖）、爱国者（北原游击队领袖）。\n\
